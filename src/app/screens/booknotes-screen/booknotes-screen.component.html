<app-note-top-nav
  [sourceScreen]="'booknotes'"
  [style]="themeService.getTopNavStyles('booknotes')"
  (clickMenu)="clickMenuOnChild()"
  (clickNotes)="clickNotesOnChild()"
  (clickConnect)="clickConnectOnChild()"
  (clickQuit)="clickQuitOnChild()"
  (clickReads)="clickReadsOnChild()"
></app-note-top-nav>

<!-- Skill Tree - Always visible in background -->
<app-skill-tree
  [sourceScreen]="'booknotes'"
  (closeClicked)="clickCloseNotesOnChild()"
  (noteClicked)="clickNoteOnChild($event)"
  [class.skill-tree-blurred]="showNoteContainer"
></app-skill-tree>

<!-- Note Container Overlay -->
@if (showNoteContainer) {
  <div class="note-overlay" (click)="onOverlayClick($event)">
    <app-note-container
      [sourceScreen]="'booknotes'"
      [style]="themeService.getNoteContainerStyles('booknotes')"
      (goBack)="onGoBack()"
      class="note-overlay-container"
      (click)="$event.stopPropagation()"
    ></app-note-container>
  </div>
}

<app-bottom-nav
  [sourceScreen]="'booknotes'"
  (menuClicked)="clickMenuOnChild()"
></app-bottom-nav>
