# /etc/nginx/conf.d/aronsnotes.conf (deployed from the repo's nginx/ folder)

# HTTP → HTTPS
server {
    listen 80;
    server_name aronsnotes.com www.aronsnotes.com;
    return 301 https://$host$request_uri;
}

# HTTPS — prerendered Angular: every page is a folder with its own index.html
server {
    listen 443 ssl;
    server_name aronsnotes.com www.aronsnotes.com;

    ssl_certificate     /etc/letsencrypt/live/aronsnotes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aronsnotes.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # old addresses (/about, /practice, /note/41, ...), written by scripts/generate.ts
    include /etc/nginx/aronsnotes-redirects.conf;

    # /git-reset is served from /git-reset/index.html, without a trailing-slash redirect
    location / {
        try_files $uri $uri/index.html =404;
    }

    # real 404s, with the prerendered not-found page
    error_page 404 /404/index.html;
}
